
name: Root setup
description: Configure the selected root implementation

inputs:
  flavor:
    description: Root implementation
    required: true
  root_commit:
    description: Root implementation commit
    required: true
  source_dir:
    description: Kernel source directory
    required: true

runs:
  using: composite
  steps:
    - name: Resolve root implementation
      shell: bash
      working-directory: ${{ inputs.source_dir }}
      env:
        FLAVOR: ${{ inputs.flavor }}
        EXPECTED_COMMIT: ${{ inputs.root_commit }}
      run: |
        set -euo pipefail

        # Verify the Android kernel source root.
        if [ ! -d "drivers" ] || [ ! -f "drivers/Makefile" ] || [ ! -f "Kconfig" ]; then
          echo "ERROR: source_dir is not the Android kernel source root: $PWD" >&2
          echo "Expected drivers/, drivers/Makefile, and Kconfig." >&2
          exit 1
        fi

        case "$FLAVOR" in
          kernelsu)
            repo="https://github.com/tiann/KernelSU.git"
            directory="KernelSU"
            manager="KernelSU Manager"
            ;;
          next)
            repo="https://github.com/KernelSU-Next/KernelSU-Next.git"
            directory="KernelSU-Next"
            manager="KernelSU Next Manager"
            ;;
          resukisu)
            repo="https://github.com/rsuntk/ResukiSU.git"
            directory="ResukiSU"
            manager="ReSukiSU Manager"
            ;;
          sukisu-ultra)
            repo="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
            directory="SukiSU-Ultra"
            manager="SukiSU-Ultra Manager"
            ;;
          kowsu)
            repo="https://github.com/ShirkNeko/KernelSU.git"
            directory="KernelSU"
            manager="KOWSU Manager"
            ;;
          *)
            echo "Unsupported root flavor: $FLAVOR" >&2
            exit 1
            ;;
        esac

        if [ -e "$directory" ]; then
          echo "Refusing to reuse an existing root checkout: $directory." >&2
          exit 1
        fi

        git clone --no-checkout "$repo" "$directory"
        git -C "$directory" fetch --depth=1 origin "$EXPECTED_COMMIT"
        git -C "$directory" checkout --detach "$EXPECTED_COMMIT"

        actual_commit="$(git -C "$directory" rev-parse HEAD)"
        if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
          echo "Root commit mismatch: expected $EXPECTED_COMMIT, got $actual_commit." >&2
          exit 1
        fi

        if [ ! -f "$directory/kernel/Kconfig" ] || [ ! -f "$directory/kernel/Makefile" ]; then
          echo "Selected root checkout does not contain a kernel integration." >&2
          exit 1
        fi

        # Pixel 8a (akita) workaround for SukiSU-Ultra.
        if [ "$FLAVOR" = "sukisu-ultra" ]; then
          supercall_file="$directory/kernel/supercall/supercall.c"

          if [ ! -f "$supercall_file" ]; then
            echo "SukiSU-Ultra supercall source not found: $supercall_file" >&2
            exit 1
          fi

          grep -q 'fd = get_unused_fd_flags(O_CLOEXEC);' "$supercall_file" || {
            echo "Expected SukiSU-Ultra Pixel 8a source line not found." >&2
            exit 1
          }

          sed -i \
            's/fd = get_unused_fd_flags(O_CLOEXEC);/fd = get_unused_fd_flags(0);/' \
            "$supercall_file"

          echo "Applied Pixel 8a SukiSU-Ultra supercall workaround."
          grep -n -A2 -B2 'get_unused_fd_flags' "$supercall_file"
        fi

        root_version="$(git -C "$directory" describe --tags --always --dirty)"

        relative_kernel="$(realpath --relative-to="$PWD/drivers" "$PWD/$directory/kernel")"
        ln -s "$relative_kernel" "drivers/kernelsu"

        grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile ||
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile

        grep -q 'source "drivers/kernelsu/Kconfig"' Kconfig ||
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' Kconfig

        echo "ROOT_IMPLEMENTATION=$FLAVOR" >> "$GITHUB_ENV"
        echo "ROOT_MANAGER=$manager" >> "$GITHUB_ENV"
        echo "ROOT_VERSION=$root_version" >> "$GITHUB_ENV"
        echo "ROOT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

    - name: Enable root configuration
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y

    - name: Disable multi-manager for ReSukiSU
      if: inputs.flavor == 'resukisu'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=n
          CONFIG_KSU_TOOLKIT_SUPPORT=y
